[versions]
# Core toolchain
agp = "9.2.1"
kotlin = "2.2.10"
ksp = "2.3.2"

# Compose
compose-bom = "2026.08.00"
activity-compose = "1.10.1"
lifecycle = "2.9.0"
navigation-compose = "2.10.0"

# Hilt + DI
# androidx.hilt is held at 1.2.0 by compileSdk, same wall as core-ktx above: 1.4.0 requires
# compileSdk 37 and transitively pulls lifecycle 2.11.0, which requires 37 too — so the
# catalog pin of lifecycle 2.9.0 does not hold it back (CI run 33662166299).
hilt = "2.56.2"
hilt-navigation-compose = "1.2.0"

# Persistence
room = "2.8.4"
datastore = "1.1.1"

# Health Connect (on-device recovery signals — sleep, resting HR — for the coach)
health-connect = "1.1.0"

# CameraX (in-app guided progress-photo capture with a pose-ghost overlay)
camerax = "1.4.2"

# Biometric / device-credential app lock (GYMAP-69) — no app PIN stored; the OS handles the credential
biometric = "1.1.0"

# Async
coroutines = "1.9.0"

# Serialization (W1 — the wear Data Layer protocol DTOs in :shared)
#
# Floored at 1.9.0 by ROOM, not by the wear protocol. Room 2.8 parses its exported schema JSON with
# kotlinx-serialization, and its `$$serializer` classes are compiled against 1.9+, where
# `GeneratedSerializer.typeParametersSerializers()` has a DEFAULT body and so is not overridden. On
# 1.7.3 that method is still `abstract`, so the migration test died at runtime with
# `AbstractMethodError` the moment MigrationTestHelper read a schema — a failure only the emulator
# job can see, because it is the only one that opens a database.
#
# 1.9.0 and not later: it wants Kotlin stdlib 2.2.0 and this project is on 2.2.10, while 1.11.0
# wants 2.3.20 and would make this a toolchain upgrade instead of a compatibility fix.
kotlinx-serialization = "1.9.0"

# Wear OS (W1–W4: watch app, tiles, complications, live HR)
wear-compose = "1.4.1"
play-services-wearable = "20.0.1"
wear-tiles = "1.6.2"
protolayout = "1.4.2"
watchface-complications = "1.3.0"
wear-ongoing = "1.1.0"
health-services = "1.0.0"
concurrent-futures = "1.2.0"

# WorkManager
work = "2.10.1"
hilt-work = "1.2.0"

# Test
junit = "4.13.2"
# Screenshot testing (Roborazzi runs on the JVM via Robolectric, so no emulator and no AGP coupling).
roborazzi = "1.73.0"
robolectric = "4.16.1"
androidx-test-junit = "1.3.0"
espresso = "3.7.0"

# Startup performance (Baseline Profile + Macrobenchmark — P2)
profileinstaller = "1.4.1"
benchmark = "1.4.1"
uiautomator = "2.4.0"

[libraries]
# Core AndroidX
# core-ktx is held at 1.17.0 by compileSdk: 1.19.0 fails :app/:wear checkDebugAarMetadata with
# "requires ... version 37 or later of the Android APIs" (CI run 33660499290). Raising it means
# compileSdk 37 in :app and :wear plus the two sdkmanager pins in ci.yml — a build-policy change,
# not a dependency bump. Dependabot will keep proposing 1.19.0 until that happens.
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.17.0" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version = "1.2.0" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version = "1.4.2" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# Compose (BOM pins all compose libs to compatible versions)
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule", version.ref = "roborazzi" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }

# Navigation
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-navigation-compose" }

# Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
# The migration test's helper. Same version.ref as the other three on purpose: room-testing
# resolving apart from room-runtime is a runtime-only failure in the one job that opens a
# database, which is the most expensive place in this pipeline to discover anything.
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# DataStore
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Health Connect
androidx-health-connect = { group = "androidx.health.connect", name = "connect-client", version.ref = "health-connect" }

# CameraX
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

# Biometric — BiometricPrompt + device-credential fallback for the app/gallery lock (GYMAP-69)
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }

# Coroutines
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

# Serialization (W1 protocol)
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Wear OS (W1–W4)
play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "play-services-wearable" }
wear-compose-material = { group = "androidx.wear.compose", name = "compose-material", version.ref = "wear-compose" }
wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wear-compose" }
wear-tiles = { group = "androidx.wear.tiles", name = "tiles", version.ref = "wear-tiles" }
protolayout = { group = "androidx.wear.protolayout", name = "protolayout", version.ref = "protolayout" }
protolayout-material = { group = "androidx.wear.protolayout", name = "protolayout-material", version.ref = "protolayout" }
protolayout-expression = { group = "androidx.wear.protolayout", name = "protolayout-expression", version.ref = "protolayout" }
watchface-complications-data-source-ktx = { group = "androidx.wear.watchface", name = "watchface-complications-data-source-ktx", version.ref = "watchface-complications" }
wear-ongoing = { group = "androidx.wear", name = "wear-ongoing", version.ref = "wear-ongoing" }
health-services-client = { group = "androidx.health", name = "health-services-client", version.ref = "health-services" }
concurrent-futures-ktx = { group = "androidx.concurrent", name = "concurrent-futures-ktx", version.ref = "concurrent-futures" }

# WorkManager
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hilt-work" }
hilt-androidx-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hilt-work" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-junit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

# Startup performance (P2)
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
