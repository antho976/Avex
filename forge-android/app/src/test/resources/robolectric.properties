# Match the explicit screenshot SDK instead of following targetSdk during dependency upgrades.
# Mixing default SDK 36 native SQLite with SDK 34 UI sandboxes raced the native font ZIP loader.
# API-specific tests retain their explicit @Config(sdk=...) overrides.
sdk=34
# Unit/DAO tests must not launch background Hilt/Room startup against a second, unrelated database.
# ForgeStartupTest and CoachFreshnessTest explicitly opt into the real application graph.
application=android.app.Application
