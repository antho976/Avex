# 4 GB, not 2. The Kotlin backend's Compose lambda inlining is the memory high-water mark of this
# build, and at 2 GB it sits close enough to the ceiling that the SAME commit compiles in one CI job
# and dies with "GC overhead limit exceeded" in the next — a red that is not the code's fault, which
# costs a cycle and a reviewer's trust exactly like a green that is not the code's fault. -Xmx is a
# ceiling rather than a reservation, so this costs a laptop nothing until the compiler needs it.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# The Kotlin compile daemon is a SEPARATE JVM and inherits org.gradle.jvmargs only when it has no
# args of its own — stating it here keeps the two from drifting apart on a future edit to the line
# above, since the daemon is where the OOM actually happens.
kotlin.daemon.jvmargs=-Xmx4096m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
