# Dependency updates: monthly, one PR per ecosystem directory, so a month of drift arrives as about
# four reviewable PRs (Gradle, the two Remotion projects, Actions) instead of a weekly stream.
# Security advisories are not held to this schedule; Dependabot opens those as soon as they land.
#
# Gradle is a single group because these libraries only make sense in versioned sets: bumping one
# Compose artifact past the BOM, or kotlin without ksp, or AGP without the Kotlin it was tested with,
# produces a build that fails in a way that reads as Dependabot being broken rather than the split
# being wrong. Splitting the Android build into five groups produced exactly that: the Kotlin/AGP
# PR was red on its own while the others were green.
#
# CI runs on every one of these PRs, which is the point — an update whose test suite goes red is
# information, and an update nobody can evaluate is just noise.

version: 2
updates:
  - package-ecosystem: gradle
    directory: /forge-android
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      android:
        patterns:
          - "*"

  # The two Remotion projects (release video, feature vignettes) were absent from this file, so
  # nothing opened update PRs for them and their lockfiles drifted until a dozen transitive
  # advisories piled up in the security tab with no corresponding fix PR. Grouped per project and
  # limited to a single PR each: this is render tooling for marketing video, not shipped code, and
  # it should cost one review a month at most.
  #
  # ci.yml ignores remotion-*/** by design, so these PRs run no CI. Each project carries its own
  # `npm run check`; run it before merging if the diff is more than a patch-level lockfile refresh.
  - package-ecosystem: npm
    directory: /remotion-vignettes
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      remotion-vignettes:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /remotion-release
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      remotion-release:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
