name: CI

# Builds Forge and runs the JVM unit-test suite on every push/PR to main.
# Activates automatically once this repo has a GitHub remote — no setup needed.
#
# Notes for this project specifically:
#  • The Gradle project lives in forge-android/ (not the repo root) → `-p forge-android`.
#  • There is no committed Gradle wrapper, so we provision Gradle via the official
#    setup-gradle action (pinned to the same version used locally).
#  • Release builds are intentionally left UNSIGNED in CI (no secrets), so we build
#    the debug variant + assembleRelease(unsigned) to exercise R8 keep rules.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the older in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Cache Robolectric runtime jars
        # Robolectric fetches its android-all jars at TEST time into ~/.m2, outside Gradle's
        # dependency resolution — so setup-gradle's cache does not cover them. Without this, every
        # CI run re-downloads a few hundred MB and inherits Maven Central's bad days as flaky tests.
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('forge-android/gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-

      - name: Unit tests
        # testDebugUnitTest covers the Android modules (:app + :wear); :shared is a pure Kotlin/JVM
        # library whose task is `test` — without it the protocol + rest-timer suites would silently
        # never run in CI (W1).
        run: gradle -p forge-android testDebugUnitTest :shared:test --no-daemon

      - name: Screenshot goldens (design doctrine §14)
        # Renders the six archetype recipes at 100% and 200% font scale, on Pearl and AMOLED, with
        # and without accent, and diffs them against the committed goldens in
        # app/src/test/screenshots/. Catches what no static rule can: clipping, overlap and spacing
        # regressions. Re-record deliberately with :app:recordRoborazziDebug and LOOK at the diff.
        run: gradle -p forge-android :app:verifyRoborazziDebug --no-daemon

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diffs
          path: forge-android/app/build/outputs/roborazzi/**
          if-no-files-found: ignore

      - name: Assemble debug APKs (phone + wear)
        run: gradle -p forge-android assembleDebug --no-daemon

      - name: Assemble release (unsigned, exercises R8)
        run: gradle -p forge-android assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: forge-debug-apk
          path: |
            forge-android/app/build/outputs/apk/debug/*.apk
            forge-android/wear/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
